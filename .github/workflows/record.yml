name: Record website showcase

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL website (harus online/publik, contoh https://websitelu.com)"
        required: true
        type: string
      mode:
        description: "Tampilan"
        required: true
        default: both
        type: choice
        options:
          - both
          - desktop
          - mobile
      seconds:
        description: "Durasi scroll (detik)"
        required: true
        default: "14"
        type: string
      fps:
        description: "FPS (30 atau 60)"
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "60"

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record desktop
        if: ${{ inputs.mode != 'mobile' }}
        env:
          SITE_URL: ${{ inputs.url }}
          SECONDS_: ${{ inputs.seconds }}
          FPS: ${{ inputs.fps }}
        run: node record.mjs "$SITE_URL" --seconds="$SECONDS_" --fps="$FPS" --out=out/showcase-desktop.mp4

      - name: Record mobile
        if: ${{ inputs.mode != 'desktop' }}
        env:
          SITE_URL: ${{ inputs.url }}
          SECONDS_: ${{ inputs.seconds }}
          FPS: ${{ inputs.fps }}
        run: node record.mjs "$SITE_URL" --mobile --seconds="$SECONDS_" --fps="$FPS" --out=out/showcase-mobile.mp4

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: showcase-videos
          path: out/
          if-no-files-found: error
